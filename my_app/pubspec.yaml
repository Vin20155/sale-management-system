name: my_app
description: Mart Sales Management System (Flutter client).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  device_preview: ^1.3.1
  flutter_easyloading: ^3.0.5
  shared_preferences: ^2.5.5
  http: ^1.2.0
  image_picker: ^1.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: KhmerOS
      fonts:
        - asset: assets/fonts/KhmerOS.ttf
    - family: KhmerOSbattambang
      fonts:
        - asset: assets/fonts/KhmerOSbattambang.ttf
    - family: LeelawUI
      fonts:
        - asset: assets/fonts/LeelawUI.ttf
